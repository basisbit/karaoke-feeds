# Karaoke feed on nginx. Put this file into /etc/nginx/conf.d/ (it must be included inside the http block).
# Before use, replace:
#   feed.example.org         your host name
#   /var/www/feed            the folder the feed is uploaded into
#   /var/www/acme            the webroot for Let's Encrypt (certbot --webroot), or delete that location
#   /etc/ssl/feed/...        your certificate and key
# Logging: no access log. Errors go to /var/log/nginx/feed/error.log, kept 14 days by hosting/nginx/logrotate
#   (copy it to /etc/logrotate.d/karaoke-feed). Create the folder first: mkdir -m 0750 /var/log/nginx/feed
# nginx older than 1.25.1 (e.g. Debian 12): remove "http2 on;" and write "listen 443 ssl http2;" instead.
# Also merge hosting/nginx/main.conf into /etc/nginx/nginx.conf (workers, open file limit).
# Reasons for every limit: docs/hosting.md, section "Security and rate limits".

# --- Who is one client, and who may connect at all ---
# Direct (default): the connecting address is the client, everyone may connect.
map $http_x_feed_origin_auth $feed_client  { default $binary_remote_addr; }
map $http_x_feed_origin_auth $feed_refused { default 0; }
# Behind a CDN (docs/hosting.md section 5.1): delete the two lines above and remove the "# " from the two below.
# Put your own secret in both, and the CDN's client address header: $http_x_real_ip (bunny.net) or
# $http_cf_connecting_ip (Cloudflare). Requests without the secret get 403, so nobody can bypass the CDN.
# map $http_x_feed_origin_auth $feed_client  { default $binary_remote_addr; "change-me-to-a-long-random-secret" $http_x_real_ip; }
# map $http_x_feed_origin_auth $feed_refused { default 1; "change-me-to-a-long-random-secret" 0; }

# --- Private feed (docs/hosting.md section 9): personal addresses https://feed.example.org/s/<token>/feed.json ---
# The token of a request, if its address has one.
map $uri $feed_token { default ""; "~^/s/(?<feed_t>[A-Za-z0-9_-]{22,128})/" $feed_t; }
# Public feed (default): everyone may read it, and addresses with a token are refused.
map $feed_token $feed_token_ok { default 0; "" 1; }
# Private feed: delete the line above and remove the "# " from the line below. Then only addresses with a token
# from /etc/nginx/feed-tokens.map work. That file has one line per token:   the-token 1;
# After changing it: nginx -s reload (downloads that are running continue).
# map $feed_token $feed_token_ok { default 0; include /etc/nginx/feed-tokens.map; }
# Answers to personal addresses must not be kept by shared caches.
map $feed_token $feed_scope { default private; "" public; }

# --- Per client (http level, shared by both server blocks) ---
# 20 requests/s on average with bursts up to 200: a game syncing a category fetches many files in a row.
limit_req_zone  $feed_client zone=feed_req:10m rate=20r/s;
# At most 32 requests in progress at the same time (parallel downloads).
limit_conn_zone $feed_client zone=feed_conn:10m;

# Cache-Control per path. Sent only with successful responses (no "always" below), so a 404 is never cached for a year.
# The web page (index.html/.css/.js and songs-<category>.html, made by kfeed build) may load its own stylesheet
# and script, nothing else.
# Everything else may load nothing at all.
map $uri $feed_csp {
    default                     "default-src 'none'; frame-ancestors 'none'";
    "~^/(index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html)?$" "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'";
}

map $uri $feed_cache_control {
    default                     "";
    /feed.json                  "$feed_scope, max-age=300, stale-if-error=86400";
    "~^/(index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html)?$" "$feed_scope, max-age=300";
    ~^/(blobs|catalog|sig)/     "$feed_scope, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name feed.example.org;
    server_tokens off;
    access_log off;
    error_log  /var/log/nginx/feed/error.log warn;

    limit_req  zone=feed_req burst=200 nodelay;
    limit_conn feed_conn 32;
    limit_req_status  429;
    limit_conn_status 429;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # backlog: queue for new connections during bursts. reuseport: spreads new connections evenly over the workers.
    # If "nginx -t" reports "duplicate listen options", another site already sets options for port 443:
    # then remove "backlog=4096 reuseport" here.
    listen 443 ssl backlog=4096 reuseport;
    listen [::]:443 ssl backlog=4096 reuseport;
    http2 on;
    server_name feed.example.org;

    ssl_certificate     /etc/ssl/feed/fullchain.pem;
    ssl_certificate_key /etc/ssl/feed/privkey.pem;
    # Mozilla "intermediate" profile: TLS 1.2 and 1.3 only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:feed_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/feed;
    server_tokens off;

    # No access log: no IP addresses are stored for normal downloads. Errors and refused clients are logged.
    access_log off;
    error_log  /var/log/nginx/feed/error.log warn;
    autoindex off;
    disable_symlinks on;     # the feed uses hard links, never symlinks
    gzip off;                # feed files must arrive byte for byte; checksums cover the stored bytes

    # Many downloads at once.
    aio threads;             # read files in a thread pool: a slow disk never blocks the other downloads
    output_buffers 2 256k;   # HTTPS reads files in these chunks; larger chunks = fewer reads per download
    sendfile on;             # zero-copy for plain http (mirrors); HTTPS can't use it without kernel TLS
    tcp_nopush on;
    # Keep open file handles for the immutable files. A replaced feed.json or a deleted blob is noticed within 30 s.
    open_file_cache          max=4000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_errors   off;
    reset_timedout_connection on;   # free the memory of clients that stopped reading at once
    keepalive_requests 1000;
    http2_max_concurrent_streams 32;  # each stream counts against limit_conn, like a connection

    # Slow or oversized requests (slowloris and similar). Downloads themselves are not time-limited.
    client_header_timeout 10s;
    client_body_timeout   10s;
    client_max_body_size  1k;          # nothing is ever uploaded
    large_client_header_buffers 4 8k;
    keepalive_timeout 30s;
    send_timeout      60s;             # time between two writes, not the whole download

    limit_req  zone=feed_req burst=200 nodelay;
    limit_conn feed_conn 32;
    limit_req_status  429;
    limit_conn_status 429;

    if ($feed_refused) { return 403; }   # behind a CDN: request didn't come through the CDN

    # Only reading, and no query strings: games never send them, and "?random" would bypass every cache.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($request_uri ~ "\?")            { return 400; }

    # Private feed: without a valid token 403; with one, /s/<token>/feed.json is served as /feed.json.
    if ($feed_token_ok = 0) { return 403; }
    # Optional, for a private feed: let a CDN or a file store deliver the big files. Remove the "# " and put in
    # its address; it must serve the folder blobs/. Whoever knows a file's checksum can then fetch it there.
    # rewrite "^/s/[A-Za-z0-9_-]{22,128}(/blobs/[0-9a-f]{2}/[0-9a-f]{64})$" https://cdn.example.org$1 redirect;
    rewrite "^/s/[A-Za-z0-9_-]{22,128}(/.*)$" $1;

    # Headers on every response, errors included.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header X-Content-Type-Options       nosniff always;
    add_header Content-Security-Policy      $feed_csp always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Referrer-Policy              no-referrer always;
    add_header Strict-Transport-Security    "max-age=31536000" always;
    add_header Cache-Control                $feed_cache_control;

    # Only the feed's own files. Everything else, including the folder listings, is 404.
    # The web page. Only its files are compressed (a song page of a big feed is several MB).
    location = / {
        index index.html;
    }
    location ~ "^/(index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html)$" {
        types { text/html html; text/css css; text/javascript js; }
        charset utf-8;
        gzip on;
        gzip_types text/css text/javascript;
        gzip_vary on;
    }
    location = /feed.json {
        types { }
        default_type application/json;
    }
    location ~ "^/(sig/[0-9a-f]{64}\.sig|catalog/[0-9a-f]{64}\.json(\.gz)?|blobs/[0-9a-f]{2}/[0-9a-f]{64})$" {
        types { }
        default_type application/octet-stream;
    }
    location / {
        return 404;
    }
}
