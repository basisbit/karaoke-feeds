# Main-level nginx settings for serving many downloads at once.
# These can't go into conf.d/: merge them into /etc/nginx/nginx.conf, replacing the existing
# worker_processes and worker_rlimit_nofile lines and the events { } block.

worker_processes auto;          # one worker per CPU core

# Open files per worker. Each download needs 2 (the connection and the file), so this must be at least
# 2 x worker_connections plus the open_file_cache size in feed.conf. nginx raises the limit for its workers
# itself; no systemd LimitNOFILE change is needed (the master starts as root).
worker_rlimit_nofile 20000;

events {
    worker_connections 4096;    # per worker: with 4 cores, up to 16384 connections in total
}
