# Optional Linux settings for a server that mainly serves downloads.
# Copy to /etc/sysctl.d/ and run "sysctl --system" as root. Several of these are already the default on
# current distributions.

# Fair sharing of the uplink between connections, and pacing for BBR.
net.core.default_qdisc = fq
# BBR keeps throughput high on long-distance and slightly lossy lines (needs the tcp_bbr module; check
# "sysctl net.ipv4.tcp_available_congestion_control").
net.ipv4.tcp_congestion_control = bbr
# Don't fall back to a slow start when a keep-alive connection was idle for a moment.
net.ipv4.tcp_slow_start_after_idle = 0
# Queue for new connections during bursts; matches "backlog=4096" in hosting/nginx/feed.conf.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
