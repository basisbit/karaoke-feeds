# systemd drop-in: more open files for Apache. Without it, Apache runs out of file descriptors with many
# HTTP/2 downloads at once ("Too many open files" in the error log) at the default limit of 1024.
# Fedora/RHEL:   /etc/systemd/system/httpd.service.d/limits.conf
# Debian/Ubuntu: /etc/systemd/system/apache2.service.d/limits.conf
# Then: systemctl daemon-reload && systemctl restart httpd   (Debian: apache2)
[Service]
LimitNOFILE=65536
