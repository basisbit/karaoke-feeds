# Server-wide Apache settings for serving many downloads at once.
# Put this file into /etc/httpd/conf.d/ (Debian: /etc/apache2/conf-available/ + a2enconf). It sizes the event MPM;
# the MPM itself is chosen elsewhere (Fedora: conf.modules.d/00-mpm.conf; it must be "event").
#
# With HTTPS, every running download keeps one worker thread busy until it is finished, so MaxRequestWorkers
# is the number of downloads that can run at the same time. Further clients wait in the queue.
# Memory: roughly 10-20 MB per process; 16 processes as below fit a 1-2 GB server. Scale ServerLimit with RAM.
<IfModule mpm_event_module>
    StartServers               4
    ServerLimit               16
    ThreadsPerChild           64
    MaxRequestWorkers       1024
    MinSpareThreads          128
    MaxSpareThreads          512
    AsyncRequestWorkerFactor   2
    MaxConnectionsPerChild     0
</IfModule>

# Open files: install hosting/apache/limits.conf as well. The default limit of 1024 per process is not enough:
# HTTP/2 connections need several file descriptors each, so about a thousand downloads at once exhaust it.

# sendfile is used for plain http; HTTPS goes through mod_ssl.
EnableSendfile On
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 1000
# A connection is dropped after 60 s without any progress.
Timeout 60
