# Karaoke feed on Apache httpd 2.4. Put this file into /etc/httpd/conf.d/ (Fedora/RHEL) or
# /etc/apache2/sites-available/ (Debian/Ubuntu, then a2ensite).
# Also install hosting/apache/tuning.conf (worker sizing) and hosting/apache/limits.conf (systemd open-file limit).
# Needs the modules ssl, headers, rewrite, reqtimeout, http2 (all part of Apache) and for rate limits mod_qos
# (Fedora/RHEL: package mod_qos; on other distributions check whether it is packaged).
# Before use, replace:
#   feed.example.org         your host name
#   /var/www/feed            the folder the feed is uploaded into
#   /var/www/acme            the webroot for Let's Encrypt (certbot --webroot), or delete that Alias
#   /etc/ssl/feed/...        your certificate and key
# Logging: no access log. Errors go to /var/log/httpd/feed/error.log (Debian: /var/log/apache2/feed/error.log),
#   kept 14 days by hosting/apache/logrotate (copy it to /etc/logrotate.d/karaoke-feed).
#   Create the folder first: mkdir -m 0750 /var/log/httpd/feed
# Reasons for every limit: docs/hosting.md, section "Security and rate limits".

# --- Behind a CDN (docs/hosting.md section 5.1): remove the "#" from these three lines, with your own secret and
# the CDN's client address header (bunny.net: X-Real-IP, Cloudflare: CF-Connecting-IP). Requests without the
# secret then get 403, and the rate limits count the real clients instead of the CDN's servers.
#Define FEED_BEHIND_CDN
#Define FEED_CDN_SECRET change-me-to-a-long-random-secret
#Define FEED_CDN_CLIENT_IP_HEADER X-Real-IP

# --- Private feed (docs/hosting.md section 9): personal addresses https://feed.example.org/s/<token>/feed.json
# Remove the "#" from the first line. Then only addresses with a token from /etc/httpd/feed-tokens.txt work
# (Debian: change that path below). The file has one line per token:   the-token 1
# Changes to the file take effect at once, without a reload.
# Optional: let a CDN or a file store deliver the big files. Remove the "#" from the second line too and put in
# its address; it must serve the folder blobs/. Whoever knows a file's checksum can then fetch it there.
#Define FEED_PRIVATE
#Define FEED_PRIVATE_BLOBS https://cdn.example.org

# --- Server-wide settings. They affect every site on this Apache; merge with your existing ones. ---
ServerTokens Prod
ServerSignature Off
TraceEnable Off
# Slow requests (slowloris): headers within 10-20 s, body within 10 s, at least 500 bytes/s.
RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500

<IfModule qos_module>
    # Per client IP: at most 32 connections, and 200 requests per 10 s (about 20/s with bursts).
    # A client over the limit gets 429 for the rest of the 10 s window.
    QS_ClientEntries         100000
    <IfDefine !FEED_BEHIND_CDN>
        QS_SrvMaxConnPerIP   32
    </IfDefine>
    <IfDefine FEED_BEHIND_CDN>
        # Connections all come from the CDN's servers, so only requests are counted, per real client.
        QS_ClientIpFromHeader ${FEED_CDN_CLIENT_IP_HEADER}
    </IfDefine>
    QS_ClientEventLimitCount 200 10
    QS_ErrorResponseCode     429
    SetEnvIf Request_URI "^" QS_Limit=1
</IfModule>

<VirtualHost *:80>
    ServerName feed.example.org
    ErrorLog  /var/log/httpd/feed/error.log
    LogLevel  warn
    CustomLog /dev/null common
    Alias /.well-known/acme-challenge/ /var/www/acme/.well-known/acme-challenge/
    <Directory /var/www/acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://feed.example.org%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName feed.example.org

    # No access log: no IP addresses are stored for normal downloads. Apache has no "off"; a CustomLog
    # inside the site replaces the server's main access log for this site, and /dev/null keeps nothing.
    ErrorLog  /var/log/httpd/feed/error.log
    LogLevel  warn
    CustomLog /dev/null common
    DocumentRoot /var/www/feed
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/ssl/feed/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/feed/privkey.pem
    # Mozilla "intermediate" profile: TLS 1.2 and 1.3 only.
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off
    SSLSessionTickets off

    LimitRequestBody 1024
    LimitRequestFieldSize 8190

    # Only reading, and no query strings: games never send them, and "?random" would bypass every cache.
    RewriteEngine On
    <IfDefine FEED_BEHIND_CDN>
        # The request didn't come through the CDN.
        RewriteCond %{HTTP:X-Feed-Origin-Auth} "!=${FEED_CDN_SECRET}"
        RewriteRule ^ - [F,L]
    </IfDefine>
    RewriteCond %{REQUEST_METHOD} !^(GET|HEAD)$
    RewriteRule ^ - [R=405,L]
    RewriteCond %{THE_REQUEST} "^\S+ [^ ?]*\?"
    RewriteRule ^ - [R=400,L]
    <IfDefine FEED_PRIVATE>
        # Without a valid token 403; with one, /s/<token>/feed.json is served as /feed.json.
        RewriteMap feedtokens "txt:/etc/httpd/feed-tokens.txt"
        RewriteRule "^/s/([A-Za-z0-9_-]{22,128})(/.*)$" - [E=FEED_TOKEN:$1,E=FEED_PATH:$2]
        RewriteCond "${feedtokens:%{ENV:FEED_TOKEN}|0}" "!=1"
        RewriteRule ^ - [F,L]
        <IfDefine FEED_PRIVATE_BLOBS>
            RewriteCond %{ENV:FEED_PATH} "^/blobs/[0-9a-f]{2}/[0-9a-f]{64}$"
            RewriteRule ^ "${FEED_PRIVATE_BLOBS}%{ENV:FEED_PATH}" [R=302,L]
        </IfDefine>
        RewriteRule "^/s/[A-Za-z0-9_-]{22,128}(/.*)$" "$1"
    </IfDefine>
    # The landing page made by kfeed build, then only the feed's own files; everything else, including folder listings, is 404.
    RewriteRule "^/$" "/index.html" [L]
    RewriteRule "^/(feed\.json|index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html|sig/[0-9a-f]{64}\.sig|catalog/[0-9a-f]{64}\.json(\.gz)?|blobs/[0-9a-f]{2}/[0-9a-f]{64})$" - [L]
    RewriteRule ^ - [R=404,L]

    # Headers on every response, errors included. (The paths below also match behind a personal address
    # /s/<token>/ of a private feed: Apache compares them with the address as it was requested.)
    Header always set Access-Control-Allow-Origin  "*"
    Header always set X-Content-Type-Options       nosniff
    Header always set Content-Security-Policy      "default-src 'none'; frame-ancestors 'none'"
    # The landing page may load its own stylesheet and script, nothing else.
    Header always set Content-Security-Policy      "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" "expr=%{REQUEST_URI} =~ m#^(/s/[^/]+)?/(index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html)?$#"
    Header always set Cross-Origin-Resource-Policy cross-origin
    Header always set Referrer-Policy              no-referrer
    Header always set Strict-Transport-Security    "max-age=31536000"
    # Cache-Control only on successful responses ("set" without "always"), so a 404 is never cached for a year.
    Header set Cache-Control "public, max-age=300, stale-if-error=86400" "expr=%{REQUEST_URI} =~ m#^(/s/[^/]+)?/feed\.json$#"
    Header set Cache-Control "public, max-age=300" "expr=%{REQUEST_URI} =~ m#^(/s/[^/]+)?/(index\.(html|css|js)|songs-[a-z0-9][a-z0-9._-]{0,63}\.html)?$#"
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{REQUEST_URI} =~ m#^(/s/[^/]+)?/(blobs|catalog|sig)/#"
    # Private feed: answers to personal addresses must not be kept by shared caches.
    Header edit Cache-Control "^public" "private" env=FEED_TOKEN

    # Feed files must arrive byte for byte: never compressed, no Content-Encoding for .gz files.
    # Only the web page is compressed (a song page of a big feed is several MB).
    SetEnvIf Request_URI "^(/s/[^/]+)?/(feed\.json|sig/|catalog/|blobs/)" no-gzip=1
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript
    </IfModule>
    <Directory /var/www/feed>
        Options None
        AllowOverride None
        Require all granted
        RemoveEncoding .gz
        AddCharset utf-8 .html .css .js
    </Directory>
    <LocationMatch "^(/s/[^/]+)?/(blobs|catalog|sig)/">
        ForceType application/octet-stream
    </LocationMatch>
</VirtualHost>
