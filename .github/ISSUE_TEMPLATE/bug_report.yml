name: Bug report
description: kfeed, a configuration or a guide doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems please **not** here, but privately: see the security policy.
  - type: input
    id: version
    attributes:
      label: kfeed version
      description: Output of `kfeed version`, or the commit you built from
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran and its full output (remove private addresses and keys).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Feed address (if public), game and version, web server, CDN.
